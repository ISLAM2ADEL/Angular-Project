<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <button class="back-btn" (click)="onClose()">
      <img src="/arrow-turn-backward.svg" alt="back">
    </button>

    <div class="header">
      <h1>Add A Movie</h1>
      <div class="magic-icon">
        <img src="/magic.svg" alt="magic">
      </div>
    </div>

    <div class="profile-section">
      <div class="icon-container">
        <div class="camera-icon">
          <img [src]="movie.thumbnail || '/video.svg'" alt="camera" [class.uploaded]="!!movie.thumbnail">
        </div>
        <button class="edit-icon" type="button" (click)="fileInput.click()">
          <img src="/edit.svg" alt="edit">
        </button>
        <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" hidden>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" #movieForm="ngForm">
      <div class="form-grid">
        <app-form-input label="Name" name="name" [(ngModel)]="movie.name" placeholder="abdelrhman khaled"
          [control]="name" required #name="ngModel" errorMsg="name field is required" />

        <app-form-input label="Title" name="title" [(ngModel)]="movie.title" placeholder="ex. megatron"
          [control]="title" required #title="ngModel" errorMsg="title field is required" />

        <app-form-input label="Duration" name="duration" [(ngModel)]="movie.duration" placeholder="2h 25mins"
          [control]="duration" required #duration="ngModel" errorMsg="duration field is required" />

        <app-form-input label="Category" name="category" [(ngModel)]="movie.category" placeholder="ex. Comedy"
          [control]="category" required #category="ngModel" errorMsg="category field is required" [isSelect]="true" 
          [options]="categories" [isDropShadow]="true" />
      </div>

      <app-form-input label="Description" name="description" [(ngModel)]="movie.description"
        placeholder="In a world where memories are harvested like crops..." [control]="desc" required #desc="ngModel"
        errorMsg="description field is required" [isTextarea]="true" [fullWidth]="true" />

      <div class="form-grid">
        <app-form-input label="Date Time" name="dateTime" [(ngModel)]="movie.dateTime" placeholder="Choose date"
          type="date" iconUrl="/calendar2.svg" [isDropShadow]="true" [control]="dateTime" required #dateTime="ngModel" 
          errorMsg="date field is required" />

        <app-form-input label="Show Times" name="showTimes" [(ngModel)]="movie.showTimes"
          placeholder="Choose showtimes" iconUrl="/clock.svg" [isMultiSelect]="true" [options]="showTimesOptions" 
          [isDropShadow]="true" [control]="showTimes" required #showTimes="ngModel" errorMsg="show times are required" />
      </div>

      <div class="form-actions">
        <button type="submit" class="submit-btn" [disabled]="movieForm.invalid">
          <img src="/check.svg" alt="check">
          Add Movie
        </button>
      </div>
    </form>
  </div>
</div>
