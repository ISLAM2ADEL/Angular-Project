<div class="modal-overlay" (click)="onClose()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <button class="back-btn" (click)="onClose()">
      <img src="/arrow-turn-backward.svg" alt="back">
    </button>

    <div class="header">
      <h1>Add A Movie</h1>
      <div class="magic-icon">
        <img src="/magic.svg" alt="magic">
      </div>
    </div>

    <div class="profile-section">
      <div class="icon-container">
        <div class="camera-icon">
          <img [src]="movieForm.controls.poster.value || '/video.svg'" alt="poster" [class.uploaded]="!!movieForm.controls.poster.value">
        </div>
      </div>
    </div>

    <form [formGroup]="movieForm" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <app-form-input label="Title" placeholder="Ex. Megatron"
          [control]="movieForm.controls.title" errorMsg="title field is required" />

        <app-form-input label="Duration (mins)" type="number" placeholder="120"
          [control]="movieForm.controls.duration" errorMsg="duration is required" />

        <app-form-input label="Genre" placeholder="Choose genre(s)"
          [control]="movieForm.controls.genre" errorMsg="genre is required" [isMultiSelect]="true"
          [options]="genresOptions" [isDropShadow]="true" />

        <app-form-input label="Status" placeholder="Choose status"
          [control]="movieForm.controls.isNowShowing" errorMsg="status is required" [isSelect]="true"
          [options]="statusOptions" [isDropShadow]="true" />
      </div>

      <app-form-input label="Description" placeholder="Write a short description..." 
        [control]="movieForm.controls.description" errorMsg="description field is required" [isTextarea]="true" [fullWidth]="true" />

      <div class="form-grid">
        <app-form-input label="Release Date" placeholder="Choose date"
          type="date" iconUrl="/calendar2.svg" [isDropShadow]="true" [control]="movieForm.controls.releaseDate" 
          errorMsg="release date is required" />

        <app-form-input label="Poster URL" placeholder="https://..."
          [control]="movieForm.controls.poster" errorMsg="poster url is required" />

        <app-form-input label="Rating" placeholder="Choose rating"
          [control]="movieForm.controls.rating" errorMsg="rating is required" [isSelect]="true"
          [options]="ratingOptions" [isDropShadow]="true" />

        <app-form-input label="Language" placeholder="English"
          [control]="movieForm.controls.language" errorMsg="language is required" />

        <app-form-input label="Show Times" placeholder="Choose showtimes" iconUrl="/clock.svg"
          [control]="movieForm.controls.showTimes" errorMsg="show times are required" [isMultiSelect]="true"
          [options]="showTimesOptions" [isDropShadow]="true" />
      </div>

      <div class="form-actions">
        <button type="submit" class="submit-btn" [disabled]="movieForm.invalid">
          <img src="/check.svg" alt="check">
          Add Movie
        </button>
      </div>
    </form>
  </div>
</div>
