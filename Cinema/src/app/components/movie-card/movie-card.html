<div class="card">
    <div class="poster-container">
        <img [src]="imageUrl" class="poster">
    </div>

    <div class="info-section">
        <div class="header-row">
            <h2 class="title">{{title}}</h2>
            <span class="rating-badge">{{rating}}</span>
        </div>
        <p class="metadata">{{metadata}}</p>
    </div>
</div>
