<div class="card-container">
    <div class="image-wrapper">
        <img [src]="imageUrl">
    </div>

    <div class="content">
        <span class="release-date">{{releaseDate}}</span>
        <h2 class="title">{{title}}</h2>
        <p class="description">
            {{description}}
        </p>
        <button class="remind-btn">
            Remind Me
            <img src="reminder icon.svg" class="bell-icon">
        </button>
    </div>
</div>
