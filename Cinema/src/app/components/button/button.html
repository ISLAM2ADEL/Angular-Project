<button
  type="button"
  [class]="'btn-base btn-' + variant()"
  [class.btn-full-width]="fullWidth()"
  [disabled]="disabled()"
  (click)="onClick()">
  @if (iconPath()) {
    <span class="btn-icon" [style.-webkit-mask-image]="'url(\'' + iconPath() + '\')'" [style.mask-image]="'url(\'' + iconPath() + '\')'"></span>
  }
  @if (label()) {
    <span>{{ label() }}</span>
  }
</button>
