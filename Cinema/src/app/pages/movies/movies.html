<h1 class="main-title">Experience Cinema Excellence</h1>
<h4 class="description">Curated screenings in the heart of the city.</h4>
<app-search-bar (searchChange)="onSearchChange($event)"></app-search-bar>
<app-filters-bar (filterChanged)="onFilterChange($event)"></app-filters-bar>
<div class="movies-container">
    @for (movie of filteredMovies(); track movie._id) {
    <app-booking-movie-card [poster]="movie.poster" [rating]="movie.rating" [title]="movie.title" [genre]="movie.genre"
        [duration]="movie.duration" [routerLink]="['/movie', movie._id]" style="cursor: pointer;">
    </app-booking-movie-card>
    }
</div>
